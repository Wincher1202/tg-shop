<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVOLVE // Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #111111);
            --hint-color: var(--tg-theme-hint-color, #777777);
            --button-color: var(--tg-theme-button-color, #000000);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #f9f9f9);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            padding-bottom: 90px;
        }
        .header {
            text-align: center;
            border-bottom: 1px solid #eaeaea;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .brand-logo {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .nav-item {
            padding-bottom: 4px;
            color: var(--hint-color);
            border-bottom: 2px solid transparent;
        }
        .nav-item.active {
            color: var(--text-color);
            border-bottom: 2px solid var(--text-color);
        }
        .catalog-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .product-card {
            display: flex;
            flex-direction: column;
            position: relative;
            background: var(--card-bg);
            border-radius: 4px;
            overflow: hidden;
            padding-bottom: 12px;
        }
        .image-container {
            position: relative;
            width: 100%;
            height: 180px;
            background: #f0f0f0;
        }
        .product-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .wishlist-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .wishlist-btn.active { background: #000; color: #fff; }
        .product-info {
            padding: 8px 10px 0 10px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .designer { font-size: 11px; color: var(--hint-color); text-transform: uppercase; margin-bottom: 2px; }
        .p-title { font-size: 12px; font-weight: 500; text-transform: uppercase; margin-bottom: 6px; }
        .p-price { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
        .add-to-cart-btn {
            background: var(--button-color);
            color: var(--button-text);
            border: none;
            width: 100%;
            padding: 8px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 2px;
        }
        .cart-container { padding: 0 4px; }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            font-size: 13px;
        }
        .total-block {
            margin-top: 20px;
            font-size: 16px;
            font-weight: 800;
            text-align: right;
            text-transform: uppercase;
            margin-bottom: 15px;
        }
        .checkout-btn {
            background: var(--button-color);
            color: var(--button-text);
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand-logo">REVOLVE MAN</div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="switchTab('catalog', this)">Каталог</div>
        <div class="nav-item" onclick="switchTab('favorites', this)">Избранное (<span id="fav-count">0</span>)</div>
        <div class="nav-item" onclick="switchTab('cart', this)">Корзина (<span id="cart-count">0</span>)</div>
    </div>

    <div id="catalog-tab" class="catalog-grid"></div>
    <div id="favorites-tab" class="catalog-grid hidden"></div>
    
    <div id="cart-tab" class="cart-container hidden">
        <div id="cart-items"></div>
        <div class="total-block" id="cart-total">Итого: UAH 0</div>
        <!-- Обычная HTML кнопка, которая точно работает на любом устройстве -->
        <button class="checkout-btn" onclick="checkout()">Оформить заказ</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const products = [
            { id: 1, designer: "ASICS", title: "Кроссовки GEL-1130", price: 4493, img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400" },
            { id: 2, designer: "ASICS", title: "Кроссовки GEL-GT 2160", price: 5391, img: "https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=400" },
            { id: 3, designer: "ASICS", title: "Кроссовки GEL-KAYANO 14", price: 6739, img: "https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=400" },
            { id: 4, designer: "NIKE", title: "Мюли GEL-1130 MULE", price: 4942, img: "https://images.unsplash.com/photo-1515955656352-a1fa3ffcd111?w=400" }
        ];

        let cart = [];
        let favorites = [];

        function renderCatalog() {
            document.getElementById('catalog-tab').innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="image-container">
                        <img src="${p.img}">
                        <button class="wishlist-btn ${favorites.includes(p.id) ? 'active' : ''}" onclick="toggleFavorite(${p.id})">♥</button>
                    </div>
                    <div class="product-info">
                        <div>
                            <div class="designer">${p.designer}</div>
                            <div class="p-title">${p.title}</div>
                            <div class="p-price">UAH ${p.price.toLocaleString()}</div>
                        </div>
                        <button class="add-to-cart-btn" onclick="addToCart(${p.id})">В корзину</button>
                    </div>
                </div>
            `).join('');
        }

        function renderFavorites() {
            const container = document.getElementById('favorites-tab');
            const favProducts = products.filter(p => favorites.includes(p.id));
            if (favProducts.length === 0) {
                container.innerHTML = '<p style="grid-column: span 2; text-align: center; color: var(--hint-color); font-size: 13px;">Список избранного пуст</p>';
                return;
            }
            container.innerHTML = favProducts.map(p => `
                <div class="product-card">
                    <div class="image-container">
                        <img src="${p.img}">
                        <button class="wishlist-btn active" onclick="toggleFavorite(${p.id})">♥</button>
                    </div>
                    <div class="product-info">
                        <div>
                            <div class="designer">${p.designer}</div>
                            <div class="p-title">${p.title}</div>
                            <div class="p-price">UAH ${p.price.toLocaleString()}</div>
                        </div>
                        <button class="add-to-cart-btn" onclick="addToCart(${p.id})">В корзину</button>
                    </div>
                </div>
            `).join('');
        }

        function toggleFavorite(id) {
            if (favorites.includes(id)) {
                favorites = favorites.filter(item => item !== id);
            } else {
                favorites.push(id);
            }
            document.getElementById('fav-count').innerText = favorites.length;
            renderCatalog();
            renderFavorites();
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            document.getElementById('cart-count').innerText = cart.length;
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            tg.showAlert(`Добавлено: ${product.title}`);
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            if (cart.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--hint-color); font-size: 13px;">Корзина пуста</p>';
                document.getElementById('cart-total').innerText = 'Итого: UAH 0';
                return;
            }
            let total = 0;
            container.innerHTML = cart.map((item, index) => {
                total += item.price;
                return `
                    <div class="cart-item">
                        <div><b>${item.designer}</b><br>${item.title}</div>
                        <div><b>UAH ${item.price.toLocaleString()}</b></div>
                        <button onclick="removeFromCart(${index})" style="background:none; border:none; color:red; font-size:16px; cursor:pointer;">✕</button>
                    </div>
                `;
            }).join('');
            document.getElementById('cart-total').innerText = `Итого: UAH ${total.toLocaleString()}`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            document.getElementById('cart-count').innerText = cart.length;
            renderCart();
        }

        function switchTab(tabName, element) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            element.classList.add('active');

            document.getElementById('catalog-tab').classList.add('hidden');
            document.getElementById('favorites-tab').classList.add('hidden');
            document.getElementById('cart-tab').classList.add('hidden');

            if (tabName === 'catalog') {
                document.getElementById('catalog-tab').classList.remove('hidden');
            } else if (tabName === 'favorites') {
                document.getElementById('favorites-tab').classList.remove('hidden');
                renderFavorites();
            } else if (tabName === 'cart') {
                document.getElementById('cart-tab').classList.remove('hidden');
                renderCart();
            }
        }

        // Функция обычной кнопки заказа внутри сайта
        function checkout() {
            if (cart.length === 0) {
                alert("Корзина пуста!");
                return;
            }
            let orderData = JSON.stringify(cart);
            // Отправляем данные боту
            tg.sendData(orderData);
        }

        renderCatalog();
    </script>
</body>
</html>
