<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Адаптация под ширину любого телефона -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оптимизированная страница</title>
    <style>
        /* Базовые стили и сброс */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        /* Главный контейнер с адаптивной шириной */
        .wrapper {
            width: 100%;
            max-width: 600px; /* Идеально для ПК, на телефоне сожмется до 100% */
            background: #1e293b;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease;
        }

        /* Заголовок */
        h1 {
            font-size: clamp(1.5rem, 4vw, 2rem);
            margin-bottom: 12px;
            text-align: center;
            color: #f1f5f9;
        }

        /* Описание */
        p {
            font-size: clamp(0.95rem, 2vw, 1.1rem);
            line-height: 1.6;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 24px;
        }

        /* Блок с кнопками */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Стиль кнопок (сохранены твои элементы управления) */
        .btn {
            width: 100%;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn-primary {
            background-color: #3b82f6;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .btn-secondary {
            background-color: #334155;
            color: #cbd5e1;
        }

        .btn-secondary:hover {
            background-color: #475569;
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* Эффект нажатия для мобилок */
        .btn:active {
            transform: scale(0.97);
        }

        /* Медиа-запрос для широких экранов (ПК) */
        @media (min-width: 768px) {
            .button-group {
                flex-direction: row;
            }
            .btn {
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <h1>Добро пожаловать</h1>
        <p>Интерфейс успешно оптимизирован под мобильные устройства и ПК. Все элементы управления на месте и работают плавно.</p>
        
        <div class="button-group">
            <button class="btn btn-secondary" onclick="handleDescription()">Описание</button>
            <button class="btn btn-primary" onclick="handleAction()">Продолжить</button>
        </div>
    </div>

    <script>
        function handleDescription() {
            alert('Кнопка описания нажата. Всё работает стабильно!');
        }

        function handleAction() {
            alert('Действие выполнено успешно!');
        }
    </script>

</body>
</html>
