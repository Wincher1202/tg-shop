<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MilipStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out forwards',
                        'modal': 'modalScale 0.3s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        modalScale: {
                            '0%': { transform: 'scale(0.9)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Стили для бабочки и стартовой анимации */
        @keyframes flyAround {
            0% {
                transform: translate(-100vw, 50vh) scale(0.3) rotate(-30deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            /* Зигзаги и подлет к логотипу */
            25% {
                transform: translate(-30vw, 10vh) scale(0.6) rotate(15deg);
            }
            40% {
                transform: translate(-10vw, -15vh) scale(0.9) rotate(-10deg);
            }
            /* Кружим вокруг логотипа (около 3 секунд полета) */
            50% {
                transform: translate(-35px, -15px) scale(1) rotate(20deg);
            }
            58% {
                transform: translate(35px, 10px) scale(1) rotate(-20deg);
            }
            66% {
                transform: translate(25px, -20px) scale(1) rotate(45deg);
            }
            74% {
                transform: translate(-25px, 15px) scale(1) rotate(-30deg);
            }
            82% {
                transform: translate(-10px, -10px) scale(1) rotate(10deg);
            }
            /* Зависание возле буквы M */
            88% {
                transform: translate(-42px, -2px) scale(1) rotate(0deg);
                opacity: 1;
            }
            /* Плавный улет вверх влево */
            100% {
                transform: translate(-150vw, -80vh) scale(0.5) rotate(-45deg);
                opacity: 0;
            }
        }

        @keyframes wingFlap {
            0%, 100% { transform: scaleX(1); }
            50% { transform: scaleX(0.4); }
        }

        @keyframes wingGlow {
            0%, 100% { filter: drop-shadow(0 0 2px rgba(0, 194, 255, 0.3)); }
            50% { filter: drop-shadow(0 0 8px rgba(0, 194, 255, 0.8)); }
        }

        .butterfly-container {
            position: fixed;
            top: 35px; /* Примерная позиция логотипа по вертикали */
            left: 50%;
            z-index: 100;
            pointer-events: none;
            animation: flyAround 6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .butterfly-body {
            animation: wingGlow 2s infinite ease-in-out;
        }

        .wing-left {
            transform-origin: right center;
            animation: wingFlap 0.18s infinite ease-in-out;
        }

        .wing-right {
            transform-origin: left center;
            animation: wingFlap 0.18s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-[#D8DCF0] dark:bg-[#07101B] text-gray-900 dark:text-white transition-colors duration-300 min-h-screen flex flex-col justify-between">

    <!-- Стартовая анимация бабочки -->
    <div class="butterfly-container">
        <div class="butterfly-body relative w-8 h-8 flex items-center justify-center">
            <!-- Левое крыло -->
            <div class="wing-left absolute right-1/2 w-4 h-6 bg-gradient-to-tr from-[#00C2FF] to-purple-400 rounded-full opacity-90"></div>
            <!-- Правое крыло -->
            <div class="wing-right absolute left-1/2 w-4 h-6 bg-gradient-to-tl from-[#00C2FF] to-purple-400 rounded-full opacity-90"></div>
            <!-- Тельце бабочки -->
            <div class="w-1 h-5 bg-white rounded-full z-10"></div>
        </div>
    </div>

    <!-- Шапка сайта -->
    <header class="sticky top-0 z-40 backdrop-blur-md bg-[#D8DCF0]/80 dark:bg-[#07101B]/80 border-b border-[#B5BCD5] dark:border-[#11223A]">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <!-- Кликабельный логотип (Scroll to top) -->
            <div onclick="scrollToTop()" class="cursor-pointer font-extrabold text-xl tracking-wider text-gray-900 dark:text-white flex items-center space-x-1 hover:opacity-80 transition-opacity">
                <span>MilipStore</span>
            </div>

            <!-- Иконки действий -->
            <div class="flex items-center space-x-4">
                <button onclick="toggleTheme()" class="p-2 rounded-xl bg-white/50 dark:bg-black/20 border border-[#B5BCD5] dark:border-[#11223A]">
                    <span id="sunIcon" class="hidden">☀️</span>
                    <span id="moonIcon">🌙</span>
                </button>
                <button onclick="openFavoritesModal()" class="p-2 rounded-xl bg-white/50 dark:bg-black/20 border border-[#B5BCD5] dark:border-[#11223A]">❤️</button>
                <button onclick="openCartDrawer()" class="p-2 rounded-xl bg-white/50 dark:bg-black/20 border border-[#B5BCD5] dark:border-[#11223A] relative">
                    🛒
                    <span id="cartBadge" class="absolute -top-1 -right-1 bg-[#00C2FF] text-black text-[10px] font-extrabold w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Основной контент (пример структуры) -->
    <main class="max-w-7xl mx-auto px-4 py-12 flex-grow">
        <div class="text-center space-y-4">
            <h1 class="text-3xl sm:text-5xl font-extrabold">Добро пожаловать в MilipStore</h1>
            <p class="text-gray-600 dark:text-gray-400 max-w-xl mx-auto text-sm sm:text-base">
                Здесь вы найдете лучшие товары. Используйте навигацию, добавляйте товары в корзину и наслаждайтесь покупками.
            </p>
            <div class="pt-8">
                <button onclick="addToCart('Пример товара', 500, 'White', 'https://via.placeholder.com/150', 1)" class="px-6 py-3 bg-[#00C2FF] text-black font-extrabold rounded-2xl shadow-lg hover:opacity-90 transition-opacity">
                    Добавить тестовый товар в корзину
                </button>
            </div>
        </div>
        
        <!-- Пустое пространство для демонстрации прокрутки вниз -->
        <div class="h-[1000px] flex items-center justify-center text-gray-500 border-t border-dashed border-gray-400 mt-20">
            Прокрутите страницу вниз и нажмите на логотип вверху, чтобы вернуться наверх
        </div>
    </main>

    <!-- Подвал -->
    <footer class="border-t border-[#B5BCD5] dark:border-[#11223A] py-6 text-center text-xs text-gray-500">
        &copy; 2026 MilipStore. Все права защищены.
    </footer>

    <!-- Контейнер для тостов -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 pointer-events-none flex flex-col space-y-2"></div>

    <script>
        let currentLang = 'ru';

        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        function getCart() {
            try {
                return JSON.parse(localStorage.getItem('milip_cart')) || [];
            } catch (e) {
                return [];
            }
        }

        function getFavorites() {
            try {
                return JSON.parse(localStorage.getItem('milip_favorites')) || [];
            } catch (e) {
                return [];
            }
        }

        function addToCart(id, price, color, img, qty) {
            let cart = getCart();
            let existing = cart.find(item => item.id === id && item.color === color);
            if (existing) {
                existing.qty += qty;
            } else {
                cart.push({ id, price, color, img, qty });
            }
            localStorage.setItem('milip_cart', JSON.stringify(cart));
            updateCartUI();
            showToast(currentLang === 'ua' ? 'Додано до кошика!' : 'Добавлено в корзину!');
        }

        function toggleFavorite(id) {
            let favs = getFavorites();
            let index = favs.findIndex(item => item.id === id);
            if (index > -1) {
                favs.splice(index, 1);
            } else {
                favs.push({ id, price: 500, color: 'White', img: 'https://via.placeholder.com/150', qty: 1 });
            }
            localStorage.setItem('milip_favorites', JSON.stringify(favs));
        }

        function updateCartUI() {
            const cart = getCart();
            const badge = document.getElementById('cartBadge');
            if (badge) {
                const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
                if (totalCount > 0) {
                    badge.innerText = totalCount;
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }
            }
        }

        function showToast(text) {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'bg-[#07101B] text-white border border-[#11223A] px-4 py-3 rounded-2xl shadow-2xl text-xs font-bold animate-fade-in pointer-events-auto flex items-center space-x-2';
            toast.innerHTML = `<span>${text}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function toggleAccordion(id) {
            const el = document.getElementById(id);
            const arrow = document.getElementById(id + 'Arrow');
            if (el) {
                el.classList.toggle('hidden');
                if (arrow) {
                    arrow.style.transform = el.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
                }
            }
        }

        function openFavoritesModal() {
            let existingModal = document.getElementById('favoritesModal');
            if (existingModal) existingModal.remove();

            const favs = getFavorites();
            const modal = document.createElement('div');
            modal.id = 'favoritesModal';
            modal.className = 'fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4';
            
            let titleText = currentLang === 'ua' ? 'Обране ❤️' : 'Избранное ❤️';
            let emptyText = currentLang === 'ua' ? 'Список обраного порожній' : 'Список избранного пуст';
            let btnCartText = currentLang === 'ua' ? 'Додати у кошик' : 'Добавить в корзину';
            let btnDelText = currentLang === 'ua' ? 'Видалити' : 'Удалить';

            let contentHtml = `
                <div class="bg-[#D8DCF0] dark:bg-[#07101B] border border-[#B5BCD5] dark:border-[#11223A] w-full max-w-lg rounded-3xl p-6 shadow-2xl animate-modal relative max-h-[80vh] flex flex-col">
                    <div class="flex items-center justify-between pb-4 border-b border-[#B5BCD5] dark:border-[#11223A]">
                        <h3 class="font-extrabold text-lg text-gray-900 dark:text-white">${titleText}</h3>
                        <button onclick="document.getElementById('favoritesModal').remove()" class="text-gray-500 hover:text-black dark:hover:text-white font-bold p-2 text-lg">✕</button>
                    </div>
                    <div class="overflow-y-auto py-4 space-y-3 flex-grow">
            `;

            if (favs.length === 0) {
                contentHtml += `<p class="text-center text-gray-500 py-8 text-sm">${emptyText}</p>`;
            } else {
                favs.forEach(item => {
                    let colorNameLocal = item.color || 'White';
                    if (currentLang === 'ru') {
                        if (colorNameLocal === 'White') colorNameLocal = 'Белый';
                        if (colorNameLocal === 'Black') colorNameLocal = 'Черный';
                        if (colorNameLocal === 'Pink') colorNameLocal = 'Розовый';
                    }
                    contentHtml += `
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between bg-white/50 dark:bg-black/20 p-3 rounded-2xl border border-[#B5BCD5]/40 dark:border-[#11223A] gap-3">
                            <div class="flex items-center space-x-3 cursor-pointer">
                                <img src="${item.img}" class="w-14 h-14 object-contain rounded-xl bg-white dark:bg-black p-1">
                                <div>
                                    <h4 class="font-bold text-sm text-gray-900 dark:text-white hover:text-[#00C2FF] transition-colors">${item.id}</h4>
                                    <div class="text-[11px] text-gray-500">${currentLang === 'ua' ? 'Колір' : 'Цвет'}: <span class="font-semibold text-gray-800 dark:text-gray-200">${colorNameLocal}</span> | ${currentLang === 'ua' ? 'Кількість' : 'Количество'}: <span class="font-semibold text-gray-800 dark:text-gray-200">${item.qty || 1}</span></div>
                                    <div class="text-xs font-extrabold text-[#00C2FF]">${item.price} ₴</div>
                                </div>
                            </div>
                            <div class="flex items-center justify-between sm:justify-end space-x-3 border-t sm:border-t-0 pt-2 sm:pt-0 border-gray-300 dark:border-gray-800">
                                <button onclick="addToCart('${item.id}', ${item.price}, '${item.color || 'White'}', '${item.img}', ${item.qty || 1});" class="px-3 py-2 bg-white text-black dark:bg-[#0F172A] dark:text-white text-xs font-extrabold rounded-xl shadow hover:opacity-90 transition-all">
                                    ${btnCartText}
                                </button>
                                <button onclick="toggleFavorite('${item.id}'); openFavoritesModal();" class="text-xs font-extrabold text-red-500 hover:underline px-2 py-1">
                                    ${btnDelText}
                                </button>
                            </div>
                        </div>
                    `;
                });
            }

            contentHtml += `</div></div>`;
            modal.innerHTML = contentHtml;
            document.body.appendChild(modal);
        }

        function openCartDrawer() {
            let existingDrawer = document.getElementById('cartDrawer');
            if (existingDrawer) existingDrawer.remove();

            const cart = getCart();
            const drawer = document.createElement('div');
            drawer.id = 'cartDrawer';
            drawer.className = 'fixed inset-0 z-50 overflow-hidden';
            
            let totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            let titleText = currentLang === 'ua' ? 'Кошик 🛒' : 'Корзина 🛒';
            let emptyText = currentLang === 'ua' ? 'Кошик порожній 🛒' : 'Корзина пуста 🛒';
            let totalText = currentLang === 'ua' ? 'Загалом:' : 'Итого:';
            let btnOrderText = currentLang === 'ua' ? 'ОФОРМИТИ ЗАМОВЛЕННЯ' : 'ОФОРМИТЬ ЗАКАЗ';
            let btnDelText = currentLang === 'ua' ? 'Видалити' : 'Удалить';

            let itemsHtml = '';
            if (cart.length === 0) {
                itemsHtml = `<p class="text-center text-gray-500 py-12 text-sm">${emptyText}</p>`;
            } else {
                cart.forEach((item, index) => {
                    let colorNameLocal = item.color;
                    if (currentLang === 'ru') {
                        if (colorNameLocal === 'White') colorNameLocal = 'Белый';
                        if (colorNameLocal === 'Black') colorNameLocal = 'Черный';
                        if (colorNameLocal === 'Pink') colorNameLocal = 'Розовый';
                    }
                    itemsHtml += `
                        <div class="flex items-center justify-between bg-white/50 dark:bg-black/20 p-3 rounded-2xl border border-[#B5BCD5]/40 dark:border-[#11223A] gap-3">
                            <img src="${item.img}" class="w-14 h-14 object-contain rounded-xl bg-white dark:bg-black p-1 flex-shrink-0">
                            <div class="flex-grow min-w-0">
                                <h4 class="font-bold text-xs text-gray-900 dark:text-white truncate">${item.id}</h4>
                                <div class="text-[10px] text-gray-500">${currentLang === 'ua' ? 'Колір' : 'Цвет'}: <span class="font-semibold text-gray-800 dark:text-gray-200">${colorNameLocal}</span></div>
                                <div class="text-xs font-extrabold text-[#00C2FF] mt-0.5">${item.price} ₴ × ${item.qty}</div>
                            </div>
                            <button onclick="removeFromCart(${index})" class="text-red-500 hover:text-red-700 p-2 text-xs font-bold">${btnDelText}</button>
                        </div>
                    `;
                });
            }

            drawer.innerHTML = `
                <div class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity" onclick="document.getElementById('cartDrawer').remove()"></div>
                <div class="absolute inset-y-0 right-0 max-w-full flex pl-10">
                    <div class="w-screen max-w-md bg-[#D8DCF0] dark:bg-[#07101B] border-l border-[#B5BCD5] dark:border-[#11223A] shadow-2xl flex flex-col p-6 animate-fade-in">
                        <div class="flex items-center justify-between pb-4 border-b border-[#B5BCD5] dark:border-[#11223A]">
                            <h3 class="font-extrabold text-lg text-gray-900 dark:text-white">${titleText}</h3>
                            <button onclick="document.getElementById('cartDrawer').remove()" class="text-gray-500 hover:text-black dark:hover:text-white font-bold p-2 text-lg">✕</button>
                        </div>
                        <div class="overflow-y-auto py-4 space-y-3 flex-grow">
                            ${itemsHtml}
                        </div>
                        <div class="pt-4 border-t border-[#B5BCD5] dark:border-[#11223A] space-y-4">
                            <div class="flex items-center justify-between font-extrabold text-base">
                                <span>${totalText}</span>
                                <span class="text-[#00C2FF]">${totalPrice} ₴</span>
                            </div>
                            <button onclick="showToast('${currentLang === 'ua' ? 'Оформлення замовлення успішне!' : 'Оформление заказа успешно!'}'); localStorage.removeItem('milip_cart'); updateCartUI(); document.getElementById('cartDrawer').remove();" class="w-full h-13 bg-[#0F172A] text-white dark:bg-[#00C2FF] dark:text-black font-extrabold rounded-2xl shadow-xl flex items-center justify-center text-sm hover:opacity-90 transition-opacity">
                                ${btnOrderText}
                            </button>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(drawer);
        }

        function removeFromCart(index) {
            let cart = getCart();
            cart.splice(index, 1);
            localStorage.setItem('milip_cart', JSON.stringify(cart));
            updateCartUI();
            openCartDrawer();
        }

        function openSearchModal() { 
            showToast(currentLang === 'ua' ? 'Пошук активний' : 'Поиск активен'); 
        }
        
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            document.getElementById('sunIcon').classList.toggle('hidden');
            document.getElementById('moonIcon').classList.toggle('hidden');
        }

        // Автоматический скролл вверх при первой загрузке страницы
        window.addEventListener('beforeunload', () => {
            window.scrollTo(0, 0);
        });
        window.scrollTo(0, 0);
    </script>
</body>
</html>
