<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MILIPSTORE // CATALOG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --text-color: #ffffff;
            --hint-color: #8a99ad;
            --accent-color: #00f0ff;
            --card-bg: rgba(18, 25, 43, 0.95);
            --border-color: rgba(0, 240, 255, 0.3);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            padding-bottom: 90px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 16px;
        }
        .brand-logo {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }
        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .icon-btn {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            position: relative;
        }
        .badge-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff007f;
            color: #fff;
            font-size: 10px;
            padding: 2px 5px;
            border-radius: 50%;
        }

        .screen { display: none; }
        .screen.active { display: block; }

        .catalog-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .fav-icon {
            position: absolute;
            top: 22px;
            right: 22px;
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            z-index: 5;
        }

        /* ФОРМАТ 4:3 ДЛЯ КАРТИНОК */
        .image-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3; /* Строгий формат 4 на 3 */
            background: #0b0f19;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .image-container img, .image-container svg {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .p-title {
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: #fff;
            cursor: pointer;
        }
        .price-badge {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(0, 240, 255, 0.2));
            border: 1px solid var(--accent-color);
            border-radius: 6px;
            text-align: center;
            padding: 8px;
            font-size: 16px;
            font-weight: 800;
            color: var(--accent-color);
            margin-bottom: 8px;
        }

        .card-actions {
            display: flex;
            gap: 8px;
        }
        .action-btn {
            flex: 1;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
        }
        .action-btn.primary {
            background: linear-gradient(135deg, #00f0ff, #0077ff);
            color: #fff;
            border: none;
        }

        .back-btn {
            background: none;
            border: 1px solid var(--hint-color);
            color: var(--hint-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            margin-bottom: 14px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .detail-container, .cart-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .color-picker {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin: 14px 0;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px;
            border-radius: 6px;
        }
        .color-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #fff;
            transition: transform 0.2s;
        }
        .color-dot.active {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-color);
            transform: scale(1.15);
        }
        .dot-black { background: #1a1a1a; }
        .dot-white { background: #ffffff; }
        .dot-pink  { background: #ff007f; }

        .section-box {
            background: rgba(11, 15, 25, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 12px;
            font-size: 13px;
        }
        .section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent-color);
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        .spec-item {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .spec-item:last-child { border-bottom: none; }
        .spec-name { color: var(--hint-color); }
        .spec-val { font-weight: 600; color: #fff; }

        .checkout-btn {
            background: linear-gradient(135deg, #00f0ff, #0077ff);
            color: #fff;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.4);
            margin-top: 6px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11, 15, 25, 0.8);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .cart-item-info { font-size: 13px; }
        .cart-item-title { font-weight: 700; color: #fff; }
        .cart-item-price { color: var(--accent-color); font-weight: 600; font-size: 12px; }
        .remove-btn { background: none; border: none; color: #ff007f; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand-logo">MILIPSTORE</div>
        <div class="header-actions">
            <button class="icon-btn" onclick="openScreen('favorites')">❤️ <span id="fav-count" class="badge-count">0</span></button>
            <button class="icon-btn" onclick="openScreen('cart')">🛒 <span id="cart-count" class="badge-count">0</span></button>
            <button class="icon-btn" onclick="toggleLanguage()">UA/EN</button>
        </div>
    </div>

    <!-- ЭКРАН 1: КАТАЛОГ -->
    <div id="catalog-screen" class="screen active">
        <div class="catalog-grid" id="catalog-list"></div>
    </div>

    <!-- ЭКРАН 2: ДЕТАЛИ ТОВАРА -->
    <div id="detail-screen" class="screen">
        <button class="back-btn" onclick="openScreen('catalog')">← Назад</button>
        <div class="detail-container">
            <div class="price-badge" id="det-price"></div>
            <div class="image-container" id="det-img-container"></div>
            <div class="color-picker" id="color-picker-box">
                <div class="color-dot dot-black active" onclick="changeColor('Black', 'black', this)"></div>
                <div class="color-dot dot-white" onclick="changeColor('White', 'white', this)"></div>
                <div class="color-dot dot-pink" onclick="changeColor('Pink', 'pink', this)"></div>
            </div>
            <div class="section-box">
                <div class="section-title">Характеристики</div>
                <div id="spec-list"></div>
            </div>
            <button class="checkout-btn" onclick="addCurrentToCart()">Додати в кошик 🛒</button>
        </div>
    </div>

    <!-- ЭКРАН 3: КОШИК -->
    <div id="cart-screen" class="screen">
        <button class="back-btn" onclick="openScreen('catalog')">← Каталог</button>
        <div class="cart-container">
            <div class="section-title" style="margin-bottom: 12px;">Ваш кошик</div>
            <div id="cart-items-box"></div>
            <div class="price-badge" id="cart-total" style="margin: 14px 0;">Разом: 0 ₴</div>
            <button class="checkout-btn" onclick="checkoutCart()">ОПЛАТИТИ ЗАМОВЛЕННЯ 💳</button>
        </div>
    </div>

    <!-- ЭКРАН 4: ИЗБРАННОЕ -->
    <div id="favorites-screen" class="screen">
        <button class="back-btn" onclick="openScreen('catalog')">← Каталог</button>
        <div class="cart-container">
            <div class="section-title" style="margin-bottom: 12px;">Обрані товари</div>
            <div id="fav-items-box"></div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let currentLang = 'ua';
        let activeProductId = null;
        let selectedColor = 'Black';
        
        let cart = [];
        let favorites = [];

        const products = {
            mouse: {
                id: 'mouse',
                titleUA: "Мишка MCHOSE A7 V2 Pro",
                titleENG: "Mouse MCHOSE A7 V2 Pro",
                price: 2449,
                isCustomImg: true,
                catalogImg: "https://raw.githubusercontent.com/Wincher1202/tg-shop/main/%D0%93%D0%BB%D0%B0%D0%B2%D0%BD%D0%B0%D1%8F%20%D1%84%D0%BE%D1%82%D0%BE%20%D0%B4%D0%BB%D1%8F%20%D0%BA%D0%B0%D1%82%D0%B0%D0%BB%D0%BE%D0%B3%D0%B0.jpg",
                images: {
                    black: "https://raw.githubusercontent.com/Wincher1202/tg-shop/main/%D0%A7%D0%B5%D1%80%D0%BD%D0%B0%D1%8F%20%D0%BC%D1%8B%D1%88%D0%BA%D0%B0.jpg",
                    white: "https://raw.githubusercontent.com/Wincher1202/tg-shop/main/%D0%91%D0%B5%D0%BB%D0%B0%D1%8F%20%D0%BC%D1%8B%D1%88%D0%BA%D0%B0.jpg",
                    pink:  "https://raw.githubusercontent.com/Wincher1202/tg-shop/main/%D0%A0%D0%BE%D0%B7%D0%BE%D0%B2%D0%B0%D1%8F%20%D0%BC%D1%8B%D1%88%D0%BA%D0%B0.jpg"
                },
                specsUA: [["Сенсор", "PAW3395"], ["Вага", "59г"], ["Частота", "8000 Гц"]],
                specsENG: [["Sensor", "PAW3395"], ["Weight", "59g"], ["Rate", "8000 Hz"]]
            },
            keyboard: {
                id: 'keyboard',
                titleUA: "Клавіатура MCHOSE GX87",
                titleENG: "Keyboard MCHOSE GX87",
                price: 3899,
                isCustomImg: false,
                svgIcon: `<svg viewBox="0 0 200 150" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="15" y="35" width="170" height="80" rx="8" fill="#131b2e" stroke="#00f0ff" stroke-width="2"/><rect x="25" y="45" width="14" height="14" rx="3" fill="#00f0ff" fill-opacity="0.3"/><rect x="43" y="45" width="14" height="14" rx="3" fill="#00f0ff" fill-opacity="0.3"/><rect x="61" y="45" width="14" height="14" rx="3" fill="#00f0ff" fill-opacity="0.3"/><rect x="79" y="45" width="14" height="14" rx="3" fill="#00f0ff" fill-opacity="0.3"/><rect x="97" y="45" width="14" height="14" rx="3" fill="#00f0ff" fill-opacity="0.3"/><rect x="115" y="45" width="14" height="14" rx="3" fill="#00f0ff" fill-opacity="0.3"/><rect x="133" y="45" width="14" height="14" rx="3" fill="#00f0ff" fill-opacity="0.3"/><rect x="157" y="45" width="18" height="14" rx="3" fill="#ff007f" fill-opacity="0.5"/><rect x="25" y="65" width="150" height="40" rx="4" fill="#0b0f19"/></svg>`,
                specsUA: [["Формат", "TKL 87%"], ["Свічі", "Mechanical Custom"], ["Підключення", "3 режиму"]],
                specsENG: [["Layout", "TKL 87%"], ["Switches", "Mechanical Custom"], ["Connection", "Tri-mode"]]
            },
            headset: {
                id: 'headset',
                titleUA: "Навушники MCHOSE G9 Pro",
                titleENG: "Headset MCHOSE G9 Pro",
                price: 2999,
                isCustomImg: false,
                svgIcon: `<svg viewBox="0 0 200 150" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M55 85C55 50 75 30 100 30C125 30 145 50 145 85" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/><rect x="35" y="65" width="25" height="45" rx="8" fill="#131b2e" stroke="#00f0ff" stroke-width="2"/><rect x="140" y="65" width="25" height="45" rx="8" fill="#131b2e" stroke="#00f0ff" stroke-width="2"/><path d="M55 95L30 115" stroke="#ff007f" stroke-width="3" stroke-linecap="round"/></svg>`,
                specsUA: [["Динаміки", "50мм"], ["Звук", "7.1 Surround"], ["Автономність", "45 годин"]],
                specsENG: [["Drivers", "50mm"], ["Audio", "7.1 Surround"], ["Battery", "45 hours"]]
            }
        };

        function renderCatalog() {
            let container = document.getElementById('catalog-list');
            container.innerHTML = '';

            Object.values(products).forEach(p => {
                let title = currentLang === 'ua' ? p.titleUA : p.titleENG;
                let isFav = favorites.includes(p.id);
                let mediaHtml = p.isCustomImg ? `<img src="${p.catalogImg}" alt="${title}">` : p.svgIcon;

                container.innerHTML += `
                    <div class="product-card">
                        <div class="fav-icon" onclick="toggleFavorite('${p.id}')">${isFav ? '❤️' : '🤍'}</div>
                        <div class="image-container" onclick="openDetail('${p.id}')">${mediaHtml}</div>
                        <div class="p-title" onclick="openDetail('${p.id}')">${title}</div>
                        <div class="price-badge">${p.price.toLocaleString()} ₴</div>
                        <div class="card-actions">
                            <button class="action-btn" onclick="openDetail('${p.id}')">Опис</button>
                            <button class="action-btn primary" onclick="quickAddToCart('${p.id}')">В кошик</button>
                        </div>
                    </div>
                `;
            });
            updateCounters();
        }

        function openScreen(screenName) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenName + '-screen').classList.add('active');
            window.scrollTo(0, 0);

            if (screenName === 'cart') renderCart();
            if (screenName === 'favorites') renderFavorites();
            if (screenName === 'catalog') renderCatalog();
            if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        function openDetail(id) {
            activeProductId = id;
            let p = products[id];
            
            document.getElementById('det-price').innerHTML = p.price.toLocaleString() + ' ₴';
            
            let imgBox = document.getElementById('det-img-container');
            imgBox.innerHTML = p.isCustomImg ? `<img id="detail-img" src="${p.images.black}">` : p.svgIcon;
            
            let colorPicker = document.getElementById('color-picker-box');
            colorPicker.style.display = p.isCustomImg ? 'flex' : 'none';

            let specsHtml = '';
            let specsArr = currentLang === 'ua' ? p.specsUA : p.specsENG;
            specsArr.forEach(s => {
                specsHtml += `<div class="spec-item"><span class="spec-name">${s[0]}</span><span class="spec-val">${s[1]}</span></div>`;
            });
            document.getElementById('spec-list').innerHTML = specsHtml;

            openScreen('detail');
        }

        function changeColor(colorName, colorKey, element) {
            selectedColor = colorName;
            let p = products[activeProductId];
            if (p && p.isCustomImg) {
                document.getElementById('detail-img').src = p.images[colorKey];
            }
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            element.classList.add('active');
            if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        function toggleFavorite(id) {
            let index = favorites.indexOf(id);
            if (index > -1) favorites.splice(index, 1);
            else favorites.push(id);
            renderCatalog();
        }

        function quickAddToCart(id) {
            let p = products[id];
            cart.push({
                id: p.id,
                title: currentLang === 'ua' ? p.titleUA : p.titleENG,
                price: p.price,
                color: 'Standart'
            });
            updateCounters();
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }

        function addCurrentToCart() {
            let p = products[activeProductId];
            cart.push({
                id: p.id,
                title: (currentLang === 'ua' ? p.titleUA : p.titleENG) + (p.isCustomImg ? ` (${selectedColor})` : ''),
                price: p.price,
                color: selectedColor
            });
            updateCounters();
            openScreen('cart');
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }

        function renderCart() {
            let box = document.getElementById('cart-items-box');
            let totalBox = document.getElementById('cart-total');
            box.innerHTML = '';
            
            if (cart.length === 0) {
                box.innerHTML = '<div style="color:var(--hint-color); text-align:center; padding: 20px;">Кошик порожній</div>';
                totalBox.innerHTML = 'Разом: 0 ₴';
                return;
            }

            let total = 0;
            cart.forEach((item, index) => {
                total += item.price;
                box.innerHTML += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div class="cart-item-title">${item.title}</div>
                            <div class="cart-item-price">${item.price.toLocaleString()} ₴</div>
                        </div>
                        <button class="remove-btn" onclick="removeFromCart(${index})">✕</button>
                    </div>
                `;
            });
            totalBox.innerHTML = `Разом: ${total.toLocaleString()} ₴`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
            updateCounters();
        }

        function renderFavorites() {
            let box = document.getElementById('fav-items-box');
            box.innerHTML = '';
            if (favorites.length === 0) {
                box.innerHTML = '<div style="color:var(--hint-color); text-align:center; padding: 20px;">Немає улюблених товарів</div>';
                return;
            }
            favorites.forEach(id => {
                let p = products[id];
                let title = currentLang === 'ua' ? p.titleUA : p.titleENG;
                box.innerHTML += `
                    <div class="cart-item" style="cursor:pointer;" onclick="openDetail('${p.id}')">
                        <div class="cart-item-info">
                            <div class="cart-item-title">${title}</div>
                            <div class="cart-item-price">${p.price.toLocaleString()} ₴</div>
                        </div>
                    </div>
                `;
            });
        }

        function updateCounters() {
            document.getElementById('cart-count').innerText = cart.length;
            document.getElementById('fav-count').innerText = favorites.length;
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ua' ? 'eng' : 'ua';
            renderCatalog();
        }

        function checkoutCart() {
            if (cart.length === 0) return;
            let orderData = cart.map(item => ({
                designer: "MILIPSTORE",
                title: item.title,
                price: item.price
            }));

            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            tg.sendData(JSON.stringify(orderData));
        }

        renderCatalog();
    </script>
</body>
</html>
