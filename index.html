<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MILIPSTORE // CATALOG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --text-color: #ffffff;
            --hint-color: #8a99ad;
            --accent-color: #00f0ff;
            --card-bg: rgba(18, 25, 43, 0.95);
            --border-color: rgba(0, 240, 255, 0.3);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            padding-bottom: 90px;
        }
        .header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 16px;
        }
        .brand-logo {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }
        
        /* Сетка каталога */
        .catalog-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        
        .image-container {
            position: relative;
            width: 100%;
            height: 220px;
            background: #131b2e;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Выбор цвета для мышки */
        .color-picker {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 12px;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px;
            border-radius: 6px;
        }
        .color-dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #fff;
            transition: transform 0.2s;
        }
        .color-dot.active {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-color);
            transform: scale(1.15);
        }
        .dot-white { background: #ffffff; }
        .dot-black { background: #222222; }
        .dot-pink  { background: #ff007f; }

        /* Название и цена */
        .p-title {
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 4px;
            color: #fff;
        }
        .p-desc {
            font-size: 12px;
            color: var(--hint-color);
            margin-bottom: 10px;
        }
        .price-badge {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(0, 240, 255, 0.2));
            border: 1px solid var(--accent-color);
            border-radius: 6px;
            text-align: center;
            padding: 8px;
            font-size: 16px;
            font-weight: 800;
            color: var(--accent-color);
            margin-bottom: 12px;
        }

        /* Кнопка заказа */
        .checkout-btn {
            background: linear-gradient(135deg, #00f0ff, #0077ff);
            color: #fff;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 6px;
            box-shadow: 0 4px 12px rgba(0, 240, 255, 0.3);
        }
        .checkout-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand-logo">MILIPSTORE // CATALOG</div>
    </div>

    <div class="catalog-grid" id="catalog">
        
        <!-- ТОВАР 1: Мышка с выбором цветов -->
        <div class="product-card">
            <div class="image-container">
                <img id="mouse-img" src="https://images.unsplash.com/photo-1615663245857-ac93bb7c39e7?w=500" alt="MCHOSE A7 V2 Pro">
            </div>
            
            <!-- Интерактивный выбор цвета мышки -->
            <div class="color-picker" id="mouse-colors">
                <div class="color-dot dot-white active" title="White" onclick="changeMouseColor('White', 'https://images.unsplash.com/photo-1615663245857-ac93bb7c39e7?w=500', this)"></div>
                <div class="color-dot dot-black" title="Black" onclick="changeMouseColor('Black', 'https://images.unsplash.com/photo-1527864550417-7fd91fc51a46?w=500', this)"></div>
                <div class="color-dot dot-pink" title="Rose Red" onclick="changeMouseColor('Rose Red', 'https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=500', this)"></div>
            </div>

            <div class="p-title">Мишка MCHOSE A7 V2 Pro</div>
            <div class="p-desc">PAW3395 • 59г • 8000 Гц • Бездротова</div>
            <div class="price-badge">2 449 ₴</div>
            <button class="checkout-btn" onclick="orderMouse()">Замовити мишку</button>
        </div>

        <!-- ТОВАР 2: Клавиатура 1 -->
        <div class="product-card">
            <div class="image-container">
                <img src="https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=500" alt="Mechanical Keyboard 1">
            </div>
            <div class="p-title">Клавіатура Aula F75</div>
            <div class="p-desc">Hot-swap • RGB підсвічування • Mechanical</div>
            <div class="price-badge">3 199 ₴</div>
            <button class="checkout-btn" onclick="orderItem('Клавіатура Aula F75', 3199)">Замовити клавіатуру</button>
        </div>

        <!-- ТОВАР 3: Клавиатура 2 -->
        <div class="product-card">
            <div class="image-container">
                <img src="https://images.unsplash.com/photo-1618384887929-16ec33fab9ef?w=500" alt="Mechanical Keyboard 2">
            </div>
            <div class="p-title">Клавіатура Ajazz AK820 Pro</div>
            <div class="p-desc">TFT дисплей • Три режими • Gasket Mount</div>
            <div class="price-badge">2 899 ₴</div>
            <button class="checkout-btn" onclick="orderItem('Клавіатура Ajazz AK820 Pro', 2899)">Замовити клавіатуру</button>
        </div>

    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let selectedMouseColor = 'White';

        // Функция смены цвета мышки в каталоге
        function changeMouseColor(colorName, imgSrc, element) {
            document.getElementById('mouse-img').src = imgSrc;
            selectedMouseColor = colorName;
            
            // Переключаем активный кружок
            let dots = element.parentElement.querySelectorAll('.color-dot');
            dots.forEach(dot => dot.classList.remove('active'));
            element.classList.add('active');

            if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        // Заказ мышки с учетом выбранного цвета
        function orderMouse() {
            let orderData = JSON.stringify({
                product: "MCHOSE A7 V2 PRO",
                color: selectedMouseColor,
                price: 2449
            });

            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            tg.sendData(orderData);
        }

        // Заказ остальных товаров (клавиатур)
        function orderItem(productName, price) {
            let orderData = JSON.stringify({
                product: productName,
                price: price
            });

            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            tg.sendData(orderData);
        }
    </script>
</body>
</html>
