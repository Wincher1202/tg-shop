<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MILIPSTORE — Gaming Gear</title>
    <!-- Подключаем шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ОБЩИЕ СТИЛИ И ПЕРЕМЕННЫЕ */
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent-cyan: #00f0ff;
            --accent-purple: #7928ca;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: rgba(0, 240, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background-color: rgba(19, 27, 46, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--accent-cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color 0.2s;
        }

        .header-btn:hover {
            color: var(--accent-cyan);
        }

        .counter {
            background-color: var(--accent-purple);
            font-size: 10px;
            padding: 2px 5px;
            border-radius: 10px;
            font-weight: 600;
        }

        .lang-switch {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            transition: all 0.2s;
        }

        .lang-switch:hover {
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
        }

        /* ОСНОВНОЙ МАКЕТ (СЕТКА + ПРАВАЯ ПАНЕЛЬ) */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 180px;
            gap: 16px;
            max-width: 1200px;
            width: 100%;
            margin: 20px auto;
            padding: 0 16px;
            flex: 1;
        }

        /* СЕТКА ТОВАРОВ */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            align-content: start;
        }

        /* КАРТОЧКА ТОВАРА */
        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-cyan);
            box-shadow: 0 4px 20px rgba(0, 240, 255, 0.15);
        }

        .product-img {
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .product-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.2s ease;
        }

        /* ПЕРЕКЛЮЧАТЕЛЬ ЦВЕТОВ */
        .color-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .color-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid var(--border-color);
            transition: transform 0.2s, border-color 0.2s;
        }

        .color-dot:hover {
            transform: scale(1.1);
        }

        .color-dot.active {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 8px var(--accent-cyan);
        }

        .product-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
            justify-content: space-between;
        }

        .product-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .product-price {
            font-size: 15px;
            font-weight: 700;
            color: var(--accent-cyan);
        }

        .buy-btn {
            background: linear-gradient(135deg, var(--accent-cyan), #0082ff);
            color: #0b0f19;
            border: none;
            border-radius: 6px;
            padding: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s, box-shadow 0.2s;
            margin-top: 4px;
            width: 100%;
        }

        .buy-btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        /* ПРАВАЯ БОКОВАЯ ПАНЕЛЬ */
        .sidebar-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            height: fit-content;
        }

        .sidebar-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .sidebar-btn:hover {
            background-color: rgba(0, 240, 255, 0.05);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }

        /* АДАПТИВНОСТЬ ДЛЯ МОБИЛЬНЫХ */
        @media (max-width: 768px) {
            .main-layout {
                grid-template-columns: 1fr;
                padding-bottom: 80px;
            }

            .sidebar-panel {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                flex-direction: row;
                justify-content: space-around;
                background-color: rgba(19, 27, 46, 0.95);
                backdrop-filter: blur(12px);
                border-radius: 0;
                border-top: 1px solid var(--border-color);
                border-left: none;
                border-right: none;
                border-bottom: none;
                padding: 10px 16px;
                z-index: 100;
                gap: 8px;
            }

            .sidebar-btn {
                flex: 1;
                padding: 10px 4px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ (HEADER) -->
    <header class="header">
        <div class="logo">MILIPSTORE</div>
        <div class="header-right">
            <button class="header-btn" title="Обране">❤️ <span class="counter">0</span></button>
            <button class="header-btn" title="Кошик">🛒 <span class="counter">0</span></button>
            <div class="lang-switch">UA/EN</div>
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕЙНЕР (СЕТКА + ПРАВАЯ ПАНЕЛЬ) -->
    <div class="main-layout">
        
        <!-- СЕТКА ТОВАРОВ -->
        <main class="products-grid">
            
            <!-- Товар 1: Игровая мышь с выбором цветов -->
            <div class="product-card">
                <div class="product-img">
                    <img id="mouse-img" src="Белая мышка.jpg" alt="MCHOSE A7 V2 PRO">
                </div>
                <!-- Выбор цвета -->
                <div class="color-selector">
                    <div class="color-dot active" style="background: #ffffff;" onclick="changeColor('white', 'Белая мышка.jpg', '2449 ₴')"></div>
                    <div class="color-dot" style="background: #111111;" onclick="changeColor('black', 'Черная мышка.jpg', '2449 ₴')"></div>
                    <div class="color-dot" style="background: #ff007f;" onclick="changeColor('pink', 'Розовая мышка.jpg', '2449 ₴')"></div>
                </div>
                <div class="product-info">
                    <h3 class="product-title">MCHOSE A7 V2 PRO</h3>
                    <div>
                        <div class="product-price" id="mouse-price">2 449 ₴</div>
                        <button class="buy-btn">В КОШИК</button>
                    </div>
                </div>
            </div>

            <!-- Товар 2: Клавиатура (Рандомная категория 1) -->
            <div class="product-card">
                <div class="product-img">
                    <img src="Главная фото для каталога.jpg" alt="Mechanical Keyboard">
                </div>
                <div class="product-info">
                    <h3 class="product-title">Mechanical Keyboard RGB</h3>
                    <div>
                        <div class="product-price">2 899 ₴</div>
                        <button class="buy-btn">В КОШИК</button>
                    </div>
                </div>
            </div>

            <!-- Товар 3: Гарнитура (Рандомная категория 2) -->
            <div class="product-card">
                <div class="product-img">
                    <img src="Розовая мышка.jpg" alt="Gaming Headset">
                </div>
                <div class="product-info">
                    <h3 class="product-title">Wireless Gaming Headset</h3>
                    <div>
                        <div class="product-price">1 999 ₴</div>
                        <button class="buy-btn">В КОШИК</button>
                    </div>
                </div>
            </div>

        </main>

        <!-- ПРАВАЯ БОКОВАЯ ПАНЕЛЬ -->
        <aside class="sidebar-panel">
            <button class="sidebar-btn">☎️ Зв'язок</button>
            <button class="sidebar-btn">⭐ Відгуки</button>
            <button class="sidebar-btn">📜 Правила</button>
        </aside>

    </div>

    <script>
        // Функция переключения фото и цены для мышки по цветам
        function changeColor(color, imageName, price) {
            document.getElementById('mouse-img').src = imageName;
            document.getElementById('mouse-price').innerText = price;
            
            // Переключаем активную точку цвета
            const dots = document.querySelectorAll('.color-dot');
            dots.forEach(dot => dot.classList.remove('active'));
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
