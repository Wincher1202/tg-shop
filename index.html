<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MILIPSTORE — Gaming Gear</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Подключаем Telegram Web App скрипт -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ (HEADER) -->
    <header class="header">
        <div class="logo">MILIPSTORE</div>
        <div class="header-right">
            <button class="header-btn" title="Обране">❤️ <span class="counter">0</span></button>
            <button class="header-btn" id="cart-btn" title="Кошик">🛒 <span class="counter">1</span></button>
            <div class="lang-switch">UA/EN</div>
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕЙНЕР (СЕТКА + ПРАВАЯ ПАНЕЛЬ) -->
    <div class="main-layout">
        
        <!-- СЕТКА ТОВАРОВ -->
        <main class="products-grid">
            
            <div class="product-card">
                <div class="product-img">🎮</div>
                <div class="product-info">
                    <h3 class="product-title">ATK Blazing Sky F1 V2</h3>
                    <div class="product-price">2 699 ₴</div>
                    <button class="buy-btn" onclick="openCheckout('ATK Blazing Sky F1 V2', '2699')">КУПИТИ</button>
                </div>
            </div>

            <div class="product-card">
                <div class="product-img">⌨️</div>
                <div class="product-info">
                    <h3 class="product-title">Mechanical Keyboard</h3>
                    <div class="product-price">2 899 ₴</div>
                    <button class="buy-btn" onclick="openCheckout('Mechanical Keyboard', '2899')">КУПИТИ</button>
                </div>
            </div>

            <div class="product-card">
                <div class="product-img">🎧</div>
                <div class="product-info">
                    <h3 class="product-title">RGB Headset X</h3>
                    <div class="product-price">1 999 ₴</div>
                    <button class="buy-btn" onclick="openCheckout('RGB Headset X', '1999')">КУПИТИ</button>
                </div>
            </div>

            <div class="product-card">
                <div class="product-img">🖱️</div>
                <div class="product-info">
                    <h3 class="product-title">Wireless Pad Pro</h3>
                    <div class="product-price">799 ₴</div>
                    <button class="buy-btn" onclick="openCheckout('Wireless Pad Pro', '799')">КУПИТИ</button>
                </div>
            </div>

        </main>

        <!-- ПРАВАЯ БОКОВАЯ ПАНЕЛЬ -->
        <aside class="sidebar-panel">
            <button class="sidebar-btn">☎️ Зв'язок</button>
            <button class="sidebar-btn">⭐ Відгуки</button>
            <button class="sidebar-btn">📜 Правила</button>
        </aside>

    </div>

    <!-- МОДАЛЬНОЕ ОКНО ОФОРМЛЕНИЯ ЗАКАЗА (ЧЕКАУТ В СТИЛЕ OLX) -->
    <div class="modal-overlay" id="checkoutModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Оформлення замовлення</h2>
                <button class="close-modal" onclick="closeCheckout()">✕</button>
            </div>
            
            <div class="selected-product-preview">
                <span id="modal-product-name">Обраний товар</span>
                <strong id="modal-product-price">0 ₴</strong>
            </div>

            <form class="checkout-form" id="orderForm" onsubmit="submitOrder(event)">
                <div class="form-group">
                    <label>Імя та Прізвище*</label>
                    <input type="text" placeholder="Дмитро Мисник" required>
                </div>

                <div class="form-group">
                    <label>Номер телефону*</label>
                    <input type="tel" placeholder="+380 XX XXX XX XX" required>
                </div>

                <div class="form-group">
                    <label>Місто*</label>
                    <input type="text" placeholder="Наприклад: Київ" required>
                </div>

                <div class="form-group">
                    <label>Відділення Нової Пошти*</label>
                    <input type="text" placeholder="№5 або поштомат" required>
                </div>

                <div class="notice-box">
                    ℹ️ Захист від відмов: сплата мінімального внеску за доставку (**150 ₴**), залишок суми — післяплата на пошті.
                </div>

                <button type="submit" class="submit-order-btn">ПЕРЕЙТИ ДО ОПЛАТИ (150 ₴)</button>
            </form>
        </div>
    </div>

    <script>
        const modal = document.getElementById('checkoutModal');
        const productNameEl = document.getElementById('modal-product-name');
        const productPriceEl = document.getElementById('modal-product-price');

        function openCheckout(name, price) {
            productNameEl.textContent = name;
            productPriceEl.textContent = price + ' ₴';
            modal.style.display = 'flex';
        }

        function closeCheckout() {
            modal.style.display = 'none';
        }

        function submitOrder(event) {
            event.preventDefault();
            alert('Замовлення сформовано! Перенаправляємо на оплату внеску 150 грн...');
            // Здесь в будущем подключим отправку данных через Telegram.WebApp.sendData()
            closeCheckout();
        }
    </script>
</body>
</html>
