<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MILIPSTORE // CATALOG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --text-color: #ffffff;
            --hint-color: #8a99ad;
            --accent-color: #00f0ff;
            --card-bg: rgba(18, 25, 43, 0.95);
            --border-color: rgba(0, 240, 255, 0.3);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            padding-bottom: 90px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 16px;
        }
        .brand-logo {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }
        .lang-switch {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .screen { display: none; }
        .screen.active { display: block; }

        .catalog-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .product-card:active { transform: scale(0.98); }

        .image-container {
            position: relative;
            width: 100%;
            height: 220px;
            background: #0b0f19; /* Полный формат без обрезки с фоном */
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Картинка полностью видна, без обрезания */
        }

        .p-title {
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: #fff;
        }
        .price-badge {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(0, 240, 255, 0.2));
            border: 1px solid var(--accent-color);
            border-radius: 6px;
            text-align: center;
            padding: 8px;
            font-size: 16px;
            font-weight: 800;
            color: var(--accent-color);
        }

        .back-btn {
            background: none;
            border: 1px solid var(--hint-color);
            color: var(--hint-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            margin-bottom: 14px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .detail-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .color-picker {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin: 14px 0;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px;
            border-radius: 6px;
        }
        .color-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #fff;
            transition: transform 0.2s;
        }
        .color-dot.active {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-color);
            transform: scale(1.15);
        }
        .dot-black { background: #1a1a1a; }
        .dot-white { background: #ffffff; }
        .dot-pink  { background: #ff007f; }

        .section-box {
            background: rgba(11, 15, 25, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 12px;
            font-size: 13px;
        }
        .section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent-color);
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        .spec-item {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .spec-item:last-child { border-bottom: none; }
        .spec-name { color: var(--hint-color); }
        .spec-val { font-weight: 600; color: #fff; }

        .checkout-btn {
            background: linear-gradient(135deg, #00f0ff, #0077ff);
            color: #fff;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.4);
            margin-top: 6px;
        }
        .checkout-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand-logo" id="logo-text">MILIPSTORE // CATALOG</div>
        <button class="lang-switch" onclick="toggleLanguage()">UA / ENG</button>
    </div>

    <!-- ЭКРАН 1: КАТАЛОГ -->
    <div id="catalog-screen" class="screen active">
        <div class="catalog-grid" id="products-list">
            <!-- Товар 1: Мышка -->
            <div class="product-card" onclick="openProduct('mouse')">
                <div class="image-container">
                    <img src="https://raw.githubusercontent.com/Wincher1202/tg-shop/main/%D0%93%D0%BB%D0%B0%D0%B2%D0%BD%D0%B0%D1%8F%20%D1%84%D0%BE%D1%82%D0%BE%20%D0%B4%D0%BB%D1%8F%20%D0%BA%D0%B0%D1%82%D0%B0%D0%BB%D0%BE%D0%B3%D0%B0.jpg" alt="MCHOSE A7 V2 Pro">
                </div>
                <div class="p-title" data-i18n="p1_title">Мишка MCHOSE A7 V2 Pro</div>
                <div class="price-badge">2 449 ₴</div>
            </div>

            <!-- Товар 2: Клавиатура -->
            <div class="product-card" onclick="openProduct('keyboard')">
                <div class="image-container">
                    <img src="https://raw.githubusercontent.com/Wincher1202/tg-shop/main/%D0%A7%D0%B5%D1%80%D0%BD%D0%B0%D1%8F%20%D0%BC%D1%8B%D1%88%D0%BA%D0%B0.jpg" alt="MCHOSE GX87">
                </div>
                <div class="p-title" data-i18n="p2_title">Клавіатура MCHOSE GX87</div>
                <div class="price-badge">3 899 ₴</div>
            </div>

            <!-- Товар 3: Наушники -->
            <div class="product-card" onclick="openProduct('headset')">
                <div class="image-container">
                    <img src="https://raw.githubusercontent.com/Wincher1202/tg-shop/main/%D0%91%D0%B5%D0%BB%D0%B0%D1%8F%20%D0%BC%D1%8B%D1%88%D0%BA%D0%B0.jpg" alt="MCHOSE G9 Pro">
                </div>
                <div class="p-title" data-i18n="p3_title">Навушники MCHOSE G9 Pro</div>
                <div class="price-badge">2 999 ₴</div>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 2: ДЕТАЛИ ТОВАРА -->
    <div id="detail-screen" class="screen">
        <button class="back-btn" onclick="closeProduct()" data-i18n="back">← Назад</button>
        
        <div class="detail-container">
            <div class="price-badge" id="det-price" style="margin-bottom: 14px;">2 449 ₴</div>

            <div class="image-container">
                <img id="detail-img" alt="Product Image">
            </div>

            <!-- Выбор цвета -->
            <div class="color-picker">
                <div class="color-dot dot-black active" title="Black" onclick="changeColor('Black', 'black', this)"></div>
                <div class="color-dot dot-white" title="White" onclick="changeColor('White', 'white', this)"></div>
                <div class="color-dot dot-pink" title="Pink" onclick="changeColor('Pink', 'pink', this)"></div>
            </div>

            <!-- Характеристики -->
            <div class="section-box" style="margin-top: 14px;">
                <div class="section-title" data-i18n="specs_title">Характеристики</div>
                <div id="spec-list">
                    <!-- Заполняется динамически -->
                </div>
            </div>

            <!-- Комплектация -->
            <div class="section-box">
                <div class="section-title" data-i18n="bundle_title">Комплектація</div>
                <div style="font-size: 12px; color: var(--hint-color); line-height: 1.5;" id="bundle-text">
                    <!-- Заполняется динамически -->
                </div>
            </div>

            <!-- Кнопка заказа в один клик -->
            <button class="checkout-btn" onclick="checkout()" data-i18n="order_btn">ЗАМОВИТИ В ОДИН КЛІК</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let currentLang = 'ua';
        let currentProduct = 'mouse';
        let selectedColor = 'Black';

        // База товаров с характеристиками и ссылками на фото из GitHub
        const productsData = {
            mouse: {
                titleUA: "Мишка MCHOSE A7 V2 Pro",
                titleENG: "Mouse MCHOSE A7 V2 Pro",
                price: 2449,
                images: {
                    black: "https://raw.githubusercontent.com/Wincher1202/tg-shop/main/%D0%A7%D0%B5%D1%80%D0%BD%D0%B0%D1%8F%20%D0%BC%D1%8B%D1%88%D0%BA%D0%B0.jpg",
                    white: "https://raw.githubusercontent.com/Wincher1202/tg-shop/main/%D0%91%D0%B5%D0%BB%D0%B0%D1%8F%20%D0%BC%D1%8B%D1%88%D0%BA%D0%B0.jpg",
                    pink:  "https://raw.githubusercontent.com/Wincher1202/tg-shop/main/%D0%A0%D0%BE%D0%B7%D0%BE%D0%B2%D0%B0%D1%8F%20%D0%BC%D1%8B%D1%88%D0%BA%D0%B0.jpg"
                },
                specsUA: [
                    ["Підключення:", "2.4G / BT / Type-C"],
                    ["Сенсор:", "PAW3395"],
                    ["DPI:", "від 50 до 26 000"],
                    ["Частота опитування:", "8000 Гц"],
                    ["Вага:", "59 гр"],
                    ["Акумулятор:", "500 mAh"]
                ],
                specsENG: [
                    ["Connection:", "2.4G / BT / Type-C"],
                    ["Sensor:", "PAW3395"],
                    ["DPI:", "50 - 26,000"],
                    ["Polling Rate:", "8000 Hz"],
                    ["Weight:", "59 g"],
                    ["Battery:", "500 mAh"]
                ],
                bundleUA: "• Мишка MCHOSE A7 V2 PRO<br>• Кабель для зарядки<br>• Бездротовий приймач 2,4 ГГц<br>• Інструкція користувача<br>• Гріпси",
                bundleENG: "• MCHOSE A7 V2 PRO Mouse<br>• Charging Cable<br>• 2.4GHz Wireless Receiver<br>• User Manual<br>• Grips"
            },
            keyboard: {
                titleUA: "Клавіатура MCHOSE GX87",
                titleENG: "Keyboard MCHOSE GX87",
                price: 3899,
                images: {
                    black: "https://raw.githubusercontent.com/Wincher1202/tg-shop/main/%D0%A7%D0%B5%D1%80%D0%BD%D0%B0%D1%8F%20%D0%BC%D1%8B%D1%88%D0%BA%D0%B0.jpg",
                    white: "https://raw.githubusercontent.com/Wincher1202/tg-shop/main/%D0%91%D0%B5%D0%BB%D0%B0%D1%8F%20%D0%BC%D1%8B%D1%88%D0%BA%D0%B0.jpg",
                    pink:  "https://raw.githubusercontent.com/Wincher1202/tg-shop/main/%D0%A0%D0%BE%D0%B7%D0%BE%D0%B2%D0%B0%D1%8F%20%D0%BC%D1%8B%D1%88%D0%BA%D0%B0.jpg"
                },
                specsUA: [
                    ["Формат:", "TKL (87 клавіш)"],
                    ["Перемикачі:", "Mechanical Custom Switches"],
                    ["Підключення:", "Трьожрежимне (Bluetooth / 2.4G / Type-C)"],
                    ["Підсвічування:", "RGB LED"],
                    ["Акумулятор:", "4000 mAh"]
                ],
                specsENG: [
                    ["Layout:", "TKL (87 keys)"],
                    ["Switches:", "Mechanical Custom Switches"],
                    ["Connectivity:", "Tri-mode (Bluetooth / 2.4G / Type-C)"],
                    ["Backlight:", "RGB LED"],
                    ["Battery:", "4000 mAh"]
                ],
                bundleUA: "• Клавіатура MCHOSE GX87<br>• Знімний Type-C кабель<br>• Пулер для свічів та кейкапів<br>• Додаткові свічі<br>• Інструкція",
                bundleENG: "• MCHOSE GX87 Keyboard<br>• Detachable Type-C Cable<br>• Switch & Keycap Puller<br>• Extra Switches<br>• Manual"
            },
            headset: {
                titleUA: "Навушники MCHOSE G9 Pro",
                titleENG: "Headset MCHOSE G9 Pro",
                price: 2999,
                images: {
                    black: "https://raw.githubusercontent.com/Wincher1202/tg-shop/main/%D0%A7%D0%B5%D1%80%D0%BD%D0%B0%D1%8F%20%D0%BC%D1%8B%D1%88%D0%BA%D0%B0.jpg",
                    white: "https://raw.githubusercontent.com/Wincher1202/tg-shop/main/%D0%91%D0%B5%D0%BB%D0%B0%D1%8F%20%D0%BC%D1%8B%D1%88%D0%BA%D0%B0.jpg",
                    pink:  "https://raw.githubusercontent.com/Wincher1202/tg-shop/main/%D0%A0%D0%BE%D0%B7%D0%BE%D0%B2%D0%B0%D1%8F%20%D0%BC%D1%8B%D1%88%D0%BA%D0%B0.jpg"
                },
                specsUA: [
                    ["Тип:", "Бездротові ігрові навушники"],
                    ["Динаміки:", "50 мм з неодимовими магнітами"],
                    ["Звук:", "Об'ємний 7.1 Virtual Surround"],
                    ["Автономність:", "До 45 годин роботи"],
                    ["Мікрофон:", "З шумозаглушенням"]
                ],
                specsENG: [
                    ["Type:", "Wireless Gaming Headset"],
                    ["Drivers:", "50 mm Neodymium"],
                    ["Audio:", "7.1 Virtual Surround"],
                    ["Battery Life:", "Up to 45 hours"],
                    ["Mic:", "Noise-cancelling"]
                ],
                bundleUA: "• Гарнітура MCHOSE G9 Pro<br>• USB-радіопередавач 2.4GHz<br>• Кабель аудіо/зарядки Type-C<br>• Знімний мікрофон<br>• Чохол",
                bundleENG: "• MCHOSE G9 Pro Headset<br>• 2.4GHz USB Transmitter<br>• Type-C Audio/Charge Cable<br>• Detachable Mic<br>• Pouch"
            }
        };

        const translations = {
            ua: {
                back: "← Назад",
                specs_title: "Характеристики",
                bundle_title: "Комплектація",
                order_btn: "ЗАМОВИТИ В ОДИН КЛІК",
                p1_title: "Мишка MCHOSE A7 V2 Pro",
                p2_title: "Клавіатура MCHOSE GX87",
                p3_title: "Навушники MCHOSE G9 Pro"
            },
            eng: {
                back: "← Back",
                specs_title: "Specifications",
                bundle_title: "What's in the box",
                order_btn: "ORDER IN 1 CLICK",
                p1_title: "Mouse MCHOSE A7 V2 Pro",
                p2_title: "Keyboard MCHOSE GX87",
                p3_title: "Headset MCHOSE G9 Pro"
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'ua' ? 'eng' : 'ua';
            let t = translations[currentLang];
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                let key = el.getAttribute('data-i18n');
                if (t[key]) el.innerHTML = t[key];
            });

            updateProductView();
            if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        function openProduct(productId) {
            currentProduct = productId;
            updateProductView();

            document.getElementById('catalog-screen').classList.remove('active');
            document.getElementById('detail-screen').classList.add('active');
            window.scrollTo(0, 0);
            if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        function updateProductView() {
            let prod = productsData[currentProduct];
            
            // Текст и цены
            document.getElementById('det-price').innerHTML = prod.price.toLocaleString() + ' ₴';
            document.getElementById('detail-img').src = prod.images[selectedColor.toLowerCase()];
            
            // Характеристики
            let specsListHtml = '';
            let specsArray = currentLang === 'ua' ? prod.specsUA : prod.specsENG;
            specsArray.forEach(spec => {
                specsListHtml += `<div class="spec-item"><span class="spec-name">${spec[0]}</span><span class="spec-val">${spec[1]}</span></div>`;
            });
            document.getElementById('spec-list').innerHTML = specsListHtml;

            // Комплектация
            document.getElementById('bundle-text').innerHTML = currentLang === 'ua' ? prod.bundleUA : prod.bundleENG;
        }

        function closeProduct() {
            document.getElementById('detail-screen').classList.remove('active');
            document.getElementById('catalog-screen').classList.add('active');
            window.scrollTo(0, 0);
            if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        function changeColor(colorName, colorKey, element) {
            selectedColor = colorName;
            let prod = productsData[currentProduct];
            
            document.getElementById('detail-img').src = prod.images[colorKey];

            let dots = element.parentElement.querySelectorAll('.color-dot');
            dots.forEach(dot => dot.classList.remove('active'));
            element.classList.add('active');

            if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        function checkout() {
            let prod = productsData[currentProduct];
            let title = currentLang === 'ua' ? prod.titleUA : prod.titleENG;

            let orderData = JSON.stringify([{
                designer: "MILIPSTORE",
                title: `${title} (${selectedColor})`,
                price: prod.price
            }]);

            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            tg.sendData(orderData);
        }
    </script>
</body>
</html>
